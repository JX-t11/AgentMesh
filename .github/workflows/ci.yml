name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs-site/package-lock.json
            integrations/openclaw-agentmesh/package-lock.json
      - run: rustup component add rustfmt clippy
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm run lint --prefix web
      - run: npm run lint:typed --prefix web
      - run: npm ci --prefix docs-site
      - run: npm run build --prefix docs-site
      - run: npm ci --prefix integrations/openclaw-agentmesh
      - run: npm run typecheck --prefix integrations/openclaw-agentmesh
      - run: npm run build --prefix integrations/openclaw-agentmesh
      - run: AGENTMESH_E2E_PG_PASSWORD=ci-config-validation docker compose -f docker-compose.e2e.yml config >/dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python3 -m pip install --disable-pip-version-check -r integrations/hermes-agentmesh/requirements-dev.txt
      - run: cargo install cargo-llvm-cov --version 0.6.21 --locked
      - run: bash scripts/coverage.sh
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            target/agentmesh.lcov
            web/coverage/lcov.info
            integrations/openclaw-agentmesh/coverage/lcov.info
            integrations/hermes-agentmesh/coverage-reports/coverage.xml
          if-no-files-found: error
          retention-days: 14

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan dependency lockfiles
        run: AM_TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache" bash scripts/trivy-scan.sh deps "$RUNNER_TEMP/trivy"
      - name: Upload Trivy reports and SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-dependencies
          path: ${{ runner.temp }}/trivy/
          if-no-files-found: error
          retention-days: 30
