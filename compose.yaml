name: agentmesh

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agentmesh}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - agentmesh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agentmesh} -d $${POSTGRES_DB:-agentmesh}"]
      interval: 2s
      timeout: 3s
      retries: 15

  agentmesh-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: agentmesh-server
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:18890
      DATABASE_URL: postgres://${POSTGRES_USER:-agentmesh}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-agentmesh}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      WEB_DIST_DIR: /app/web/dist
      DOCS_DIST_DIR: /app/docs/dist
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENTMESH_BIND:-0.0.0.0}:${AGENTMESH_PORT:-18890}:18890"

volumes:
  agentmesh-pgdata:
