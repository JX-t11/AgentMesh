# SonarQube Community Build 扫描配置(main 分支;Community 不支持分支/PR 分析)
# server: http://192.168.1.234:9000(多项目共享,部署在 code-workplace/dev-tools/sonarqube)
# 扫描: SONAR_TOKEN=xxx bash scripts/sonar-scan.sh
sonar.projectKey=agentmesh
sonar.projectName=agentmesh
# 产品代码显式分组；tests/、E2E 脚本、运维脚本不参与覆盖率分母。
sonar.sources=src,web/src,integrations/openclaw-agentmesh/src,integrations/hermes-agentmesh
sonar.tests=tests,web/src,integrations/openclaw-agentmesh/src,integrations/hermes-agentmesh/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,web/src/testSetup.ts
sonar.sourceEncoding=UTF-8

# 仓库内非产品源码:文档站、规格说明、Rust 构建产物、依赖目录
sonar.exclusions=docs/**,\
  docs-site/**,\
  openspec/**,\
  .agents/**,\
  CHANGELOG,\
  CHANGELOG.md,\
  target/**,\
  .scratch/**,\
  .tmp/**,\
  .code-review-graph/**,\
  web/coverage/**,\
  web/public/connect/**,\
  web/public/downloads/**,\
  **/.env,\
  **/.env.*,\
  **/node_modules/**,\
  **/dist/**,\
  integrations/hermes-agentmesh/coverage-reports/**

# TS 类型推断取 web 工作区的 tsconfig
sonar.typescript.tsconfigPaths=web/tsconfig.json

# 覆盖率：scripts/coverage.sh 生成；SonarQube Rust 插件接受 LCOV，JS/TS 用 Vitest V8 LCOV。
sonar.rust.lcov.reportPaths=target/agentmesh.lcov
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,integrations/openclaw-agentmesh/coverage/lcov.info
sonar.python.coverage.reportPaths=integrations/hermes-agentmesh/coverage-reports/coverage.xml
