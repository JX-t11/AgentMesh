# SonarQube Community Build 扫描配置(main 分支;Community 不支持分支/PR 分析)
# server: http://192.168.1.234:9000(多项目共享,部署在 code-workplace/dev-tools/sonarqube)
# 扫描: SONAR_TOKEN=xxx bash scripts/sonar-scan.sh
sonar.projectKey=agentmesh
sonar.projectName=agentmesh
sonar.sources=.
sonar.sourceEncoding=UTF-8

# 仓库内非产品源码:文档站、规格说明、Rust 构建产物、依赖目录
sonar.exclusions=docs/**,\
  docs-site/**,\
  openspec/**,\
  .agents/**,\
  CHANGELOG,\
  CHANGELOG.md,\
  target/**,\
  **/.env,\
  **/.env.*,\
  **/node_modules/**,\
  **/dist/**

# TS 类型推断取 web 工作区的 tsconfig(Rust 不在 Community 语言覆盖内)
sonar.typescript.tsconfigPaths=web/tsconfig.json
